name: Update New API prices
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - sources.json
      - scripts/**
      - .github/workflows/update-prices.yml
permissions:
  contents: write
concurrency:
  group: model-prices-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test pricing contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate complete prices
        run: python3 scripts/update_prices.py
      - name: Publish generated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add newapi-pricing.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update generated New API model prices'
            git push
          fi
